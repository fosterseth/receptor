---
name: Publish receptorctl to PyPI
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.5.0)"
        required: true
        type: string
      repository:
        description: "Package index to publish to"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build-receptorctl:
    name: Build receptorctl distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      INDEX: ${{ inputs.repository }}
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Checkout Receptor
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install python
        uses: actions/setup-python@v7

      - name: Install dependencies
        run: |
          python3 -m pip install build==1.5.0 --only-binary :all:

      - name: Check if receptorctl version is already published
        id: check
        run: |
          if [[ "$INDEX" == "pypi" ]]; then
            INDEX_URL=https://pypi.org/pypi/receptorctl/json
          else
            INDEX_URL=https://test.pypi.org/pypi/receptorctl/json
          fi
          PUBLISHED_VERSION=$(curl --silent "$INDEX_URL" | jq --raw-output '"v" + (.info.version // "")')
          if [[ "$PUBLISHED_VERSION" == "$TAG" ]]; then
            echo "receptorctl $TAG is already on $INDEX, skipping"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Build receptorctl
        if: ${{ steps.check.outputs.should_publish == 'true' }}
        run: |
          make receptorctl_wheel receptorctl_sdist VERSION=$TAG

      - name: Upload distribution artifacts
        if: ${{ steps.check.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: receptorctl-dist
          path: receptorctl/dist/

  publish-receptorctl:
    name: Publish receptorctl to ${{ inputs.repository }}
    needs: build-receptorctl
    if: ${{ needs.build-receptorctl.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository }}
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: receptorctl-dist
          path: dist/

      - name: Publish to PyPI
        if: ${{ inputs.repository == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish to TestPyPI
        if: ${{ inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
